name: Finalize current-turn media fix

on:
  push:
    branches: [fix-current-turn-media-only]
    paths:
      - tool/finalize_current_turn_media_fix.py
      - .github/workflows/finalize-current-turn-media-fix.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-current-turn-media-only
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: python tool/finalize_current_turn_media_fix.py
      - run: flutter pub get
      - run: dart format lib/core/services/api/providers/openai/chat_completions_api.dart lib/core/services/api/providers/openai/openai_provider.dart test/chat_api_custom_image_marker_test.dart test/openai_current_turn_media_test.dart
      - name: Remove temporary automation
        run: rm tool/finalize_current_turn_media_fix.py .github/workflows/finalize-current-turn-media-fix.yml
      - name: Commit finalized fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: remove obsolete historical media replay paths"
          git push
