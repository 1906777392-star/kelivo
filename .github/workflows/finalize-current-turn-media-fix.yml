name: Finalize current-turn media fix

on:
  push:
    branches: [fix-current-turn-media-only]
    paths:
      - .github/workflows/finalize-current-turn-media-fix.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-current-turn-media-only
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Remove obsolete assistant-media replay branches
        shell: python
        run: |
          from pathlib import Path

          chat = Path('lib/core/services/api/providers/openai/chat_completions_api.dart')
          text = chat.read_text()
          text = text.replace("  final pendingAssistantMediaUrls = <String>[];\n  final pendingAssistantVideoUrls = <String>{};\n", "")
          text = text.replace("""      final listHasEmbeddedMedia =
          canImageInput &&
          content is List &&
          content.any((part) {
            if (part is! Map) return false;
            final type = (part['type'] ?? '').toString();
            return type == 'image_url' || type == 'video_url';
          });
      if (canImageInput &&
          (hasInternalMedia ||
              hasAttachedImages ||
              shouldAttachAssistantMedia ||
              (isAssistant && listHasEmbeddedMedia))) {
""", """      if (canImageInput && (hasInternalMedia || hasAttachedImages)) {
""")
          text = text.replace("""        void stashOrAddImageUrl(String url) {
          if (url.isEmpty) return;
          if (!allowRemoteImages && isRemoteHttpUrl(url)) return;
          if (isAssistant) return;
          addImageUrl(url);
        }

        void stashOrAddVideoUrl(String url) {
          if (url.isEmpty) return;
          if (isAssistant) return;
          addVideoUrl(url);
        }

""", "")
          text = text.replace("""              if (isAssistant) stashOrAddImageUrl(url);
""", "")
          text = text.replace("""              if (isAssistant) stashOrAddVideoUrl(url);
""", "")
          text = text.replace("stashOrAddVideoUrl(dataUrl);", "addVideoUrl(dataUrl);")
          text = text.replace("stashOrAddImageUrl(dataUrl);", "addImageUrl(dataUrl);")
          text = text.replace("""        if (shouldAttachAssistantMedia) {
          for (final url in pendingAssistantMediaUrls) {
            if (pendingAssistantVideoUrls.contains(url)) {
              addVideoUrl(url);
            } else {
              addImageUrl(url);
            }
          }
        }
""", "")
          text = text.replace("""    void stashOrAddImageUrl(String url) {
      if (url.isEmpty) return;
      if (!allowRemoteImages && isRemoteHttpUrl(url)) return;
      if (isAssistant) {
        if (!pendingAssistantMediaUrls.contains(url)) {
          pendingAssistantMediaUrls.add(url);
        }
        return;
      }
      addImageUrl(url);
    }

    void stashOrAddVideoUrl(String url) {
      if (url.isEmpty) return;
      if (isAssistant) {
        if (!pendingAssistantMediaUrls.contains(url)) {
          pendingAssistantMediaUrls.add(url);
        }
        pendingAssistantVideoUrls.add(url);
        return;
      }
      addVideoUrl(url);
    }

""", "")
          text = text.replace("stashOrAddImageUrl(url);", "addImageUrl(url);")
          text = text.replace("""    // Attach stashed assistant media to the last user message.
    if (shouldAttachAssistantMedia) {
      for (final url in pendingAssistantMediaUrls) {
        if (pendingAssistantVideoUrls.contains(url)) {
          addVideoUrl(url);
        } else {
          addImageUrl(url);
        }
      }
    }
""", "")
          chat.write_text(text)

          provider = Path('lib/core/services/api/providers/openai/openai_provider.dart')
          text = provider.read_text()
          text = text.replace("""    // Collect assistant images to attach to the last user message.
    // Use last *user* index so tool follow-ups still receive stashed media.
    final List<String> lastAssistantImageUrls = <String>[];
""", "")
          text = text.replace("""      // For the last user message, also attach the last assistant image if available
      const shouldAttachAssistantImage = false;

""", "")
          text = text.replace("""          shouldAttachAssistantImage) {
""", """          false) {
""")
          text = text.replace("""          // For assistant messages, collect images; for user messages, add directly
          if (isAssistant) {
            if (!lastAssistantImageUrls.contains(url)) {
              lastAssistantImageUrls.add(url);
            }
          } else {
            addImage(url);
          }
""", """          addImage(url);
""")
          text = text.replace("""          // Assistant Responses messages may only contain output_text/refusal.
          // Mirror the markdown path: stash for the following user turn.
          if (isAssistant) {
            if (!lastAssistantImageUrls.contains(dataUrl)) {
              lastAssistantImageUrls.add(dataUrl);
            }
          } else {
            addImage(dataUrl);
          }
""", """          addImage(dataUrl);
""")
          text = text.replace("""        // Attach all stashed assistant images to the last user message
        if (shouldAttachAssistantImage) {
          for (final url in lastAssistantImageUrls) {
            addImage(url);
          }
        }
""", "")
          provider.write_text(text)
      - run: flutter pub get
      - run: dart format lib/core/services/api/providers/openai/chat_completions_api.dart lib/core/services/api/providers/openai/openai_provider.dart test/chat_api_custom_image_marker_test.dart test/openai_current_turn_media_test.dart
      - name: Commit cleanup and formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/core/services/api/providers/openai/chat_completions_api.dart lib/core/services/api/providers/openai/openai_provider.dart test/chat_api_custom_image_marker_test.dart test/openai_current_turn_media_test.dart
          if git diff --cached --quiet; then
            echo "No cleanup changes"
          else
            git commit -m "fix: remove obsolete historical media replay paths"
            git push
          fi
